<!doctype html>
<html lang="en">
<head>
<title>Military Calisthenics</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Calisthenics">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#e5e3d6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#13160e" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=Saira+Stencil+One&display=swap">
<style>
/* Layout: phone-first workout flow for a 428px-wide screen. Compact header with day picker, a current-exercise card with pose thumbnail, a rest stopwatch (ring left, controls right), then the day's exercise list with ticks. */
:root {
  --bg: #e5e3d6;
  --surface: #f2f0e5;
  --fg: #1c2016;
  --muted: #5b614d;
  --line: #c4c2af;
  --work: #4a6a1c;
  --work-soft: #d7e2bd;
  --rest: #25688f;
  --rest-soft: #cbe0ec;
  --warn: #a85a0c;
  --on-accent: #f7f6ee;
  --focus: #1c2016;
  --font-display: "Saira Stencil One", "Impact", "Arial Narrow", sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13160e; --surface: #1c2116; --fg: #e7e5d4; --muted: #99a087; --line: #333a28;
    --work: #a8cc4a; --work-soft: #2b3718; --rest: #6fb2db; --rest-soft: #1a2f3d; --warn: #f0a640;
    --on-accent: #13160e; --focus: #e7e5d4;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13160e; --surface: #1c2116; --fg: #e7e5d4; --muted: #99a087; --line: #333a28;
  --work: #a8cc4a; --work-soft: #2b3718; --rest: #6fb2db; --rest-soft: #1a2f3d; --warn: #f0a640;
  --on-accent: #13160e; --focus: #e7e5d4;
  color-scheme: dark;
}

html { -webkit-text-size-adjust: 100%; }
* { box-sizing: border-box; }
body { margin: 0; }
img { max-width: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.4;
  padding-block: 12px 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 428px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
button, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

header { display: flex; align-items: end; justify-content: space-between; gap: 10px; border-bottom: 2px solid var(--fg); padding-bottom: 8px; }
h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 22px; line-height: 1; letter-spacing: 0.02em; text-transform: uppercase; }
.sub { margin: 4px 0 0; color: var(--muted); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; }

.picker { display: grid; grid-template-columns: 48px 1fr 48px; gap: 8px; }
.nav, select {
  min-height: 46px; border: 2px solid var(--fg); border-radius: 4px; background: var(--surface);
  font-family: var(--font-num); font-weight: 700; font-size: 22px;
}
.nav { cursor: pointer; }
select { width: 100%; padding: 4px 10px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
.nav:disabled { opacity: 0.38; cursor: not-allowed; }

.card { border: 1.5px solid var(--line); background: var(--surface); border-radius: 4px; padding: 12px 14px; }
.now { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; }
.chip { display: inline-block; font-family: var(--font-num); font-weight: 700; font-size: 14px; letter-spacing: 0.18em; text-transform: uppercase; padding: 2px 10px; border-radius: 3px; background: var(--work); color: var(--on-accent); }
body[data-phase="rest"] .chip { background: var(--rest); }
body[data-phase="complete"] .chip { background: var(--fg); color: var(--bg); }
.pos { margin: 8px 0 0; color: var(--muted); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; }
.name { margin: 4px 0 0; font-family: var(--font-num); font-weight: 700; font-size: 34px; line-height: 1.02; text-transform: uppercase; text-wrap: balance; overflow-wrap: anywhere; }
.pose { width: 104px; height: 78px; object-fit: cover; border: 1.5px solid var(--line); border-radius: 3px; background: var(--line); display: block; }
.upnext { margin: 10px 0 0; padding-top: 8px; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; min-height: 2.1em; }
.upnext b { color: var(--fg); font-weight: 600; }

.btn {
  min-height: 52px; border: 2px solid var(--fg); border-radius: 4px; background: var(--surface); cursor: pointer;
  font-family: var(--font-num); font-weight: 700; font-size: 20px; letter-spacing: 0.08em; text-transform: uppercase; padding: 4px 10px;
}
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: 0.38; cursor: not-allowed; }
.btn.go { width: 100%; min-height: 60px; font-size: 24px; background: var(--work); border-color: var(--work); color: var(--on-accent); margin-top: 12px; }

.rest { display: grid; grid-template-columns: 168px minmax(0, 1fr); gap: 14px; align-items: center; }
.rest h2 { grid-column: 1 / -1; margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 16px; letter-spacing: 0.06em; text-transform: uppercase; display: flex; justify-content: space-between; align-items: baseline; }
.rest h2 b { font-weight: 400; }
.rest h2 span { font-family: var(--font-num); font-weight: 600; font-size: 14px; letter-spacing: 0.1em; color: var(--muted); }
.dial { position: relative; width: 168px; height: 168px; display: grid; place-items: center; }
.dial svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.dial .track { fill: none; stroke: var(--line); stroke-width: 9; }
.dial .arc { fill: none; stroke: var(--muted); stroke-width: 9; }
body[data-phase="rest"] .dial .arc { stroke: var(--rest); }
body[data-phase="hold"] .dial .arc { stroke: var(--work); }
body[data-phase="switch"] .dial .arc { stroke: var(--rest); }
body[data-phase="switch"] .chip { background: var(--rest); }
body[data-phase="switch"] .item.cur { background: var(--rest-soft); }
.secs { position: relative; text-align: center; font-family: var(--font-num); font-weight: 600; font-size: 58px; line-height: 1; font-variant-numeric: tabular-nums; }
.secs small { display: block; font-size: 13px; font-weight: 600; letter-spacing: 0.16em; color: var(--muted); text-transform: uppercase; margin-top: 2px; }
.ctl { display: grid; grid-template-rows: repeat(3, 1fr); gap: 8px; height: 168px; }
.ctl .btn { min-height: 0; height: 100%; min-width: 0; font-size: 18px; letter-spacing: 0.04em; padding: 2px 6px; white-space: nowrap; overflow: hidden; }
.secs .act { display: block; width: max-content; margin: 7px auto 0; padding: 3px 13px; border-radius: 999px; font-family: var(--font-num); font-weight: 700; font-size: 16px; letter-spacing: 0.14em; line-height: 1.25; text-transform: uppercase; background: var(--work); color: var(--on-accent); }
.secs .act[data-mode="pause"] { background: var(--warn); }
.secs .act[data-mode="resume"] { background: var(--rest); }

.list h2 { margin: 0 0 4px; font-family: var(--font-display); font-weight: 400; font-size: 16px; letter-spacing: 0.06em; text-transform: uppercase; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.link { background: none; border: 0; padding: 8px 0 8px 8px; cursor: pointer; font-family: var(--font-num); font-weight: 600; font-size: 15px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
.items { margin: 0; padding: 0; list-style: none; }
.items li { border-top: 1px solid var(--line); }
.item { width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; background: none; border: 0; cursor: pointer; padding: 10px 4px; min-height: 48px; border-radius: 3px; }
.item .n { flex: none; width: 28px; height: 28px; border: 2px solid var(--line); border-radius: 50%; display: grid; place-items: center; font-family: var(--font-num); font-weight: 700; font-size: 16px; color: var(--muted); }
.item .t { min-width: 0; font-family: var(--font-num); font-weight: 600; font-size: 23px; line-height: 1.1; text-transform: uppercase; overflow-wrap: anywhere; }
.item.cur { background: var(--work-soft); margin-inline: -6px; padding-inline: 10px; }
body[data-phase="rest"] .item.cur { background: var(--rest-soft); }
.item.cur .n { border-color: var(--fg); color: var(--fg); }
.item.done .n { background: var(--work); border-color: var(--work); color: var(--on-accent); }
.item.done .t { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1.5px; }

.sets { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 10px 14px; }
.sets .lab { display: block; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.sets .setline { display: block; font-family: var(--font-num); font-weight: 700; font-size: 26px; line-height: 1.1; text-transform: uppercase; }
.stepper { display: grid; grid-template-columns: 44px 66px 44px; gap: 6px; align-items: center; }
.stepper .nav { min-height: 44px; font-size: 24px; }
.stepper .left { text-align: center; line-height: 1; }
.stepper .left b { display: block; font-family: var(--font-num); font-weight: 700; font-size: 38px; font-variant-numeric: tabular-nums; }
.stepper .left small { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.opts { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; border-top: 1px solid var(--line); padding-top: 10px; }
.pace { display: flex; align-items: center; gap: 6px; font-family: var(--font-num); font-weight: 600; font-size: 17px; letter-spacing: 0.06em; text-transform: uppercase; }
.pace .nav { width: 40px; min-height: 40px; font-size: 22px; }
.pace b { min-width: 4.5ch; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.btn.small[aria-pressed="true"] { background: var(--work); border-color: var(--work); color: var(--on-accent); font-weight: 700; }
.btn.small[aria-pressed="false"] { opacity: 0.75; }
.btn.small { min-height: 40px; font-size: 16px; padding-inline: 12px; }

button.name { display: block; width: 100%; background: none; border: 0; padding: 0; text-align: left; color: inherit; cursor: pointer; }
button.name:active { opacity: 0.7; }
.item .t { flex: 1; }
.item .edit { margin-left: auto; flex: none; font-family: var(--font-num); font-weight: 600; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 3px; padding: 3px 7px; }
.item .edit.on { color: var(--work); border-color: var(--work); }

body.sheet-open { overflow: hidden; }
.sheet-backdrop { position: fixed; inset: 0; z-index: 50; background: rgba(8, 10, 5, 0.55); display: flex; align-items: flex-end; justify-content: center; }
.sheet-backdrop[hidden] { display: none; }
.sheet { width: 100%; max-width: 428px; background: var(--surface); color: var(--fg); border: 2px solid var(--fg); border-bottom: 0; border-radius: 12px 12px 0 0; padding: 14px 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.sheet-head b { font-family: var(--font-display); font-weight: 400; font-size: 20px; letter-spacing: 0.03em; text-transform: uppercase; min-width: 0; overflow-wrap: anywhere; }
.sheet-head .nav { flex: none; width: 44px; min-height: 44px; font-size: 22px; }
.sheet-sub { margin: 0; color: var(--muted); font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; }
.wheel-wrap { position: relative; height: 220px; margin-block: 4px; overflow: hidden; }
.wheel-band { position: absolute; left: 4px; right: 4px; top: 88px; height: 44px; border-radius: 10px; background: var(--work-soft); box-shadow: inset 0 0 0 1.5px var(--line); z-index: 0; pointer-events: none; }
.wheel { position: relative; z-index: 1; height: 100%; overflow-x: hidden; overflow-y: auto; touch-action: pan-y; scroll-snap-type: y mandatory; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; scrollbar-width: none; padding-block: 88px; outline: none; }
.wheel::-webkit-scrollbar { display: none; }
.wheel:focus-visible { outline: 3px solid var(--focus); outline-offset: -3px; }
.wheel .it { height: 44px; display: flex; align-items: center; justify-content: center; scroll-snap-align: center; font-family: var(--font-num); font-weight: 700; font-size: 32px; font-variant-numeric: tabular-nums; cursor: pointer; will-change: transform, opacity; backface-visibility: hidden; -webkit-backface-visibility: hidden; user-select: none; -webkit-user-select: none; }
.wheel .it span { display: inline-block; width: 3ch; text-align: right; }
.wheel-fade { position: absolute; left: 0; right: 0; height: 80px; z-index: 2; pointer-events: none; }
.wheel-fade.top { top: 0; background: linear-gradient(var(--surface), transparent); }
.wheel-fade.bot { bottom: 0; background: linear-gradient(transparent, var(--surface)); }
.wheel-unit { position: absolute; right: 12px; top: 88px; height: 44px; display: flex; align-items: center; z-index: 3; pointer-events: none; font-family: var(--font-num); font-weight: 600; font-size: 19px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); max-width: 40%; line-height: 1; }
.sheet-actions { display: grid; grid-template-columns: 1fr 1.2fr 1fr; gap: 8px; }
.sheet-actions .btn { min-height: 52px; font-size: 16px; letter-spacing: 0.03em; padding-inline: 4px; white-space: nowrap; }
.dial { cursor: pointer; -webkit-tap-highlight-color: transparent; }
.dial:active { opacity: 0.85; }
.dial:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; border-radius: 50%; }
.ctl .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ctl .row2 .btn { font-size: 16px; padding-inline: 4px; white-space: nowrap; letter-spacing: 0.04em; }
#bSkip[data-mode="set"] { background: var(--work-soft); }
#bSkip[data-mode="armed"] { background: var(--work); border-color: var(--work); color: var(--on-accent); }
.sheet-actions.two { grid-template-columns: 1fr 1.4fr; }
.split { display: grid; grid-template-columns: 1fr auto; }
.split .btn { min-height: 46px; font-size: 19px; }
.split #bSkip { border-radius: 4px 0 0 4px; border-right-width: 1px; }
.split #bRestSet { border-radius: 0 4px 4px 0; border-left-width: 1px; min-width: 76px; background: var(--work-soft); letter-spacing: 0.04em; }
.sheet-actions .btn.go { margin: 0; width: auto; min-height: 52px; font-size: 20px; }

@media (prefers-reduced-motion: reduce) { .btn:active:not(:disabled) { transform: none; } }
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Military Calisthenics</h1>
      <p class="sub">Plan for beginners · 28 days</p>
    </div>
  </header>

  <div class="picker">
    <button class="nav" id="prev" type="button" aria-label="Previous day">&larr;</button>
    <select id="day" aria-label="Training day"></select>
    <button class="nav" id="next" type="button" aria-label="Next day">&rarr;</button>
  </div>

  <section class="card sets" aria-label="Sets">
    <div>
      <span class="lab">Sets today</span>
      <span class="setline" id="setLine">Set 1 of 3</span>
    </div>
    <div class="stepper">
      <button class="nav" id="setMinus" type="button" aria-label="Fewer sets">&minus;</button>
      <div class="left"><b id="setsLeft">3</b><small>sets left</small></div>
      <button class="nav" id="setPlus" type="button" aria-label="More sets">+</button>
    </div>
  </section>

  <section class="card">
    <div class="now">
      <div>
        <span class="chip" id="chip">Exercise</span>
        <p class="pos" id="pos"></p>
        <button class="name" id="name" type="button" aria-label="Adjust this exercise"></button>
      </div>
      <img class="pose" id="pose" alt="">
    </div>
    <p class="upnext" id="upnext"></p>
  </section>

  <section class="card rest" aria-label="Rest stopwatch">
    <h2><b id="restTitle">Rest stopwatch</b> <span id="restState">30 sec</span></h2>
    <div class="dial" id="dialBtn" role="button" tabindex="0" aria-label="Start">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <circle class="track" cx="60" cy="60" r="54"></circle>
        <circle class="arc" id="arc" cx="60" cy="60" r="54"></circle>
      </svg>
      <div class="secs" id="secs" role="timer" aria-live="off">30<small>sec</small><span class="act" id="dialAct" data-mode="go">Start</span></div>
    </div>
    <div class="ctl">
      <button class="btn" id="bReset" type="button">Stop</button>
      <button class="btn" id="bFinish" type="button">Finish now</button>
      <button class="btn" id="bSkip" type="button" data-mode="set">Set rest &middot; 30s &#9662;</button>
    </div>
    <div class="opts">
      <div class="pace" title="Seconds per rep"><span>Pace</span><button class="nav" id="paceMinus" type="button" aria-label="Faster">&minus;</button><b id="paceVal">2.0 s/rep</b><button class="nav" id="pacePlus" type="button" aria-label="Slower">+</button></div>
      <button class="btn small" id="bVoice" type="button" aria-pressed="true">Voice: on</button>
    </div>
  </section>

  <section class="card list">
    <h2><span id="listTitle">Day 1</span><button class="link" id="bClear" type="button">Reset day</button></h2>
    <ol class="items" id="items"></ol>
  </section>
</div>

<div class="sheet-backdrop" id="sheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head"><b id="sheetTitle">Exercise</b><button class="nav" id="sheetClose" type="button" aria-label="Close">&times;</button></div>
    <p class="sheet-sub" id="sheetSub">Set reps</p>
    <div class="wheel-wrap">
      <div class="wheel-band" aria-hidden="true"></div>
      <div class="wheel" id="wheel" tabindex="0" role="spinbutton" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Value"></div>
      <div class="wheel-fade top" aria-hidden="true"></div>
      <div class="wheel-fade bot" aria-hidden="true"></div>
      <span class="wheel-unit" id="wheelUnit" aria-hidden="true">reps</span>
    </div>
    <div class="sheet-actions" id="sheetActions">
      <button class="btn" id="sheetReset" type="button">Plan</button>
      <button class="btn go" id="sheetSave" type="button">Save</button>
      <button class="btn" id="sheetGo" type="button">Save &amp; go</button>
    </div>
  </div>
</div>

  function startReps(lead) { phase = "reps"; repN = repsOf(cur); repR = repN; repStarted = false; repNext = performance.now() + lead; running = true; lastWhole = -1; lock(); }

  function finishExercise(silent) {
    done[cur] = true;
    var n = DAYS[day].length;
    if (cur >= n - 1 && setNo >= sets) {
      phase = "complete"; stopTimer();
      beep(523, 0, 0.3, 0.3, "triangle"); beep(659, 0.2, 0.3, 0.3, "triangle"); beep(784, 0.4, 0.3, 0.3, "triangle"); beep(1047, 0.6, 0.7, 0.3, "triangle"); buzz([200, 100, 200, 100, 400]);
      speak("Workout complete. Well done.");
    } else {
      if (REST <= 0 || skipNext) { endRest(true); return; }
      startTimer("rest"); if (!silent) beep(440, 0, 0.18, 0.25, "sine");
      speak(cur >= n - 1 ? "Set complete. Rest." : "Rest.");
    }
    renderAll();
  }
  function beginExercise(prefix, quiet) {
    prefix = prefix || "";
    if (isHold(cur)) {
      side = 1; swKind = "ready"; startTimer("switch"); if (!quiet) beep(660, 0, 0.18, 0.28, "triangle");
      speak(prefix + Math.round(holdMs(cur) / 1000) + " second " + (isSide(cur) ? "side plank, each side" : "plank hold") + ". Get ready.");
      return true;
    }
    if (isReps(cur)) {
      side = 1; startReps(3000); if (!quiet) beep(660, 0, 0.18, 0.28, "triangle");
      speak(prefix + nameOf(cur) + ". Get ready.");
      return true;
    }
    return false;
  }
  function exerciseDone() {
    audio();
    if (phase === "complete") { resetDay(); return; }
    if (phase !== "exercise") return;
    if (beginExercise("", false)) { renderAll(); return; }
    finishExercise(false);
  }
  function afterSide() {
    if (isSide(cur) && side === 1) { side = 2; swKind = "side"; startTimer("switch"); speak("Switch sides"); renderAll(); return; }
    finishExercise(true);
  }
  function holdEnd() {
    running = false; unlock();
    beep(784, 0, 0.15, 0.32, "triangle"); beep(988, 0.18, 0.15, 0.32, "triangle"); beep(1319, 0.36, 0.4, 0.34, "triangle"); buzz([300, 100, 300]);
    afterSide();
  }
  function repsEnd() {
    running = false; unlock(); repR = 0;
    beep(784, 0, 0.15, 0.32, "triangle"); beep(988, 0.18, 0.15, 0.32, "triangle"); beep(1319, 0.36, 0.4, 0.34, "triangle"); buzz([300, 100, 300]);
    afterSide();
  }
  function switchEnd() {
    if (isReps(cur)) startReps(1000); else startTimer("hold");
    beep(880, 0, 0.14, 0.32, "triangle"); beep(1320, 0.2, 0.4, 0.34, "triangle"); buzz([200, 100, 200]);
    speak(swKind === "ready" ? "Go." : "Other side.");
    renderAll();
  }
  function endRest(silent) {
    var n = DAYS[day].length, newSet = cur >= n - 1;
    if (newSet) { setNo = Math.min(setNo + 1, sets); cur = 0; done = []; } else cur++;
    phase = "exercise"; stopTimer();
    if (!silent) { beep(880, 0, 0.14, 0.32, "triangle"); beep(880, 0.2, 0.14, 0.32, "triangle"); beep(1320, 0.4, 0.5, 0.34, "triangle"); buzz([300, 100, 300]); }
    var pre = newSet ? "Set " + setNo + " of " + sets + ". " : "";
    if (!beginExercise(pre, !silent)) speak(pre + "Next: " + nameOf(cur));
    renderAll();
  }
  function toggle() {
    if (!active()) return;
    audio();
    var now = performance.now();
    if (phase === "reps") {
      if (running) { repLeft = Math.max(0, repNext - now); running = false; unlock(); hush(); }
      else { repNext = now + repLeft; running = true; lock(); }
    } else if (running) { restLeft = Math.max(0, endAt - now); running = false; unlock(); }
    else { endAt = now + restLeft; running = true; lastWhole = -1; lock(); }
    renderAll();
  }
  function resetTimer() {
    if (!active()) return;
    running = false; lastWhole = -1; unlock(); hush();
    if (phase === "reps") { repR = repN; repStarted = false; repLeft = 3000; } else restLeft = total;
    renderAll();
  }
  function primary() {
    audio();
    if (phase === "complete" || phase === "exercise") exerciseDone(); else toggle();
  }
  function stopBtn() {
    if (phase === "rest") { running = false; lastWhole = -1; unlock(); hush(); restLeft = total; renderAll(); }
    else if (phase === "reps" || phase === "hold" || phase === "switch") { phase = "exercise"; stopTimer(); renderAll(); }
  }
  function finish() {
    if (phase === "switch") { if (isReps(cur)) startReps(1000); else startTimer("hold"); renderAll(); }
    else if (phase === "hold" || phase === "reps") { running = false; unlock(); hush(); afterSide(); }
  }
  function restBtn() {
    if (phase === "rest") endRest(true);
    else if (phase === "hold" || phase === "reps" || phase === "switch") { skipNext = !skipNext; renderAll(); }
    else openRestSheet();
  }
  function resetDay() { setNo = 1; cur = 0; phase = "exercise"; done = []; stopTimer(); renderAll(); }
  function loadDay(n) { day = n; try { localStorage.setItem("calisthenics-day", String(day)); } catch (e) {} resetDay(); }
  function changeSets(delta) {
    if (phase === "complete" && delta > 0 && sets < 10) { sets++; setNo++; cur = 0; done = []; phase = "exercise"; stopTimer(); }
    else sets = Math.max(Math.max(1, setNo), Math.min(10, sets + delta));
    save(); renderAll();
  }
  function changePace(delta) { tempo = Math.round(Math.max(500, Math.min(6000, tempo + delta)) / 100) * 100; save(); renderAll(); }

  setInterval(function () {
    if (!running) return;
    var now = performance.now();
    if (phase === "reps") {
      if (now >= repNext) {
        if (!repStarted) repStarted = true;
        else { repR -= 1; if (repR <= 0) { repsEnd(); return; } }
        speak(String(repR));
        if (repR >= 1 && repR <= 3) { beep(1175, 0, 0.12, 0.3, "square"); if (repR === 1) beep(1568, 0.14, 0.12, 0.3, "square"); buzz([60]); }
        else beep(1500, 0, 0.03, 0.1, "square");
        repNext += tempo; if (repNext < now) repNext = now + tempo;
        renderTimer();
      }
      return;
    }
    var rem = endAt - now;
    if (rem <= 0) { if (phase === "hold") holdEnd(); else if (phase === "switch") switchEnd(); else endRest(false); return; }
    var whole = Math.ceil(rem / 1000);
    if (whole !== lastWhole) {
      lastWhole = whole;
      if (phase === "hold" && voiceOn) speak(String(whole));
      else if (phase === "switch" && voiceOn && whole <= 3) speak(String(whole));
      else if (whole <= 3) { beep(1175, 0, 0.18, 0.35, "square"); buzz([80]); }
      else beep(1800, 0, 0.03, 0.12, "square");
    }
    renderTimer();
  }, 100);

  /* render */
  function renderTimer() {
    var on = active();
    if (phase === "reps" || (phase === "exercise" && isReps(cur))) {
      var shown = phase === "reps" ? repR : repsOf(cur), tot = phase === "reps" ? repN : repsOf(cur);
      el.secs.firstChild.nodeValue = String(shown); el.unit.textContent = "reps";
      el.arc.style.strokeDashoffset = CIRC * (1 - (tot ? shown / tot : 1));
      return;
    }
    var rem = on ? left() : total;
    el.secs.firstChild.nodeValue = String(Math.ceil(rem / 1000)); el.unit.textContent = "sec";
    el.arc.style.strokeDashoffset = CIRC * (1 - (on ? rem / total : 1));
  }
  function renderAll() {
    var ex = DAYS[day], n = ex.length, hold = isHold(cur), reps = isReps(cur), on = active();
    document.body.setAttribute("data-phase", phase);
    el.day.value = day; el.prev.disabled = day === 0; el.next.disabled = day === DAYS.length - 1;
    el.pose.src = IMGS[day]; el.pose.alt = "Day " + (day + 1) + " pose";
    el.listTitle.textContent = "Day " + (day + 1) + " · set " + setNo + "/" + sets;

    var leftSets = phase === "complete" ? 0 : sets - setNo + (done[n - 1] ? 0 : 1);
    el.setLine.textContent = phase === "complete" ? "All " + sets + " sets done" : "Set " + setNo + " of " + sets;
    el.setsLeft.textContent = String(leftSets);
    el.setMinus.disabled = sets <= Math.max(1, setNo);
    el.setPlus.disabled = sets >= 10;
    el.paceVal.textContent = (tempo / 1000).toFixed(1) + "s";
    el.paceMinus.disabled = tempo <= 500; el.pacePlus.disabled = tempo >= 6000;
    el.bVoice.textContent = (voiceOn ? "\uD83D\uDD0A Voice: ON" : "\uD83D\uDD07 Voice: off"); el.bVoice.setAttribute("aria-pressed", voiceOn ? "true" : "false");

    var primaryLabel = "Start";
    if (phase === "complete") {
      el.chip.textContent = "Complete"; el.pos.textContent = "All " + n + " exercises done";
      el.name.textContent = "Day " + (day + 1) + " finished"; el.upnext.innerHTML = "Great work. Reset to go again.";
      primaryLabel = "Restart";
    } else {
      el.chip.textContent = phase === "rest" ? "Rest" : phase === "switch" ? (swKind === "ready" ? "Get ready" : "Switch sides")
        : (phase === "hold" || phase === "reps") ? (isSide(cur) ? "Side " + side + " of 2" : (phase === "reps" ? "Reps" : "Plank hold")) : "Exercise";
      el.pos.textContent = "Exercise " + (cur + 1) + " of " + n + " · tap to adjust";
      el.name.textContent = nameOf(cur);
      var nx = cur + 1 < n ? nameOf(cur + 1) : "", lastEx = cur >= n - 1;
      var after = skipNext ? (nx ? "go straight to <b>" + nx + "</b>" : (setNo < sets ? "start <b>set " + (setNo + 1) + "</b>" : "<b>finish the day</b>")) : (nx ? "rest and <b>" + nx + "</b>" : (setNo < sets ? "rest and start <b>set " + (setNo + 1) + "</b>" : "<b>finish the day</b>"));
      el.upnext.innerHTML = phase === "rest" ? "Rest, then <b>" + (nx || (setNo < sets ? "set " + (setNo + 1) : "finish")) + "</b>" + (nx || setNo < sets ? " starts automatically" : "")
        : phase === "switch" ? (swKind === "ready" ? "Get into position. The timer starts automatically." : "Get in position on the other side. Side 2 starts automatically.")
        : (phase === "hold" || phase === "reps") && isSide(cur) && side === 1 ? (phase === "reps" ? "Count down with the voice, then switch sides." : "Hold steady. Switch sides when the time is up.")
        : phase === "reps" ? "Move with the voice count, then " + after
        : phase === "hold" ? "Hold steady, then " + after
        : (nx ? "Up next after rest: <b>" + nx + "</b>" : (setNo < sets ? "Last exercise of set " + setNo + ". Then rest and <b>set " + (setNo + 1) + "</b>" : "Last exercise of the day"));
      primaryLabel = (hold || reps) ? "Start" : "Done";
    }
    var started = phase === "reps" ? true : (restLeft < total);
    var label = (phase === "complete" || phase === "exercise") ? primaryLabel : running ? "Pause" : (started ? "Resume" : "Start");
    el.dialAct.textContent = label; el.dialAct.setAttribute("data-mode", running ? "pause" : (label === "Resume" ? "resume" : "go"));
    el.dialBtn.setAttribute("aria-label", label);
    var working = phase === "hold" || phase === "reps" || phase === "switch";
    el.bReset.disabled = !on; el.bFinish.disabled = !working; el.bSkip.disabled = false;
    el.bFinish.textContent = phase === "switch" ? (swKind === "ready" ? "Start now" : "Start side 2") : (isSide(cur) && side === 1 ? "Next side" : "Finish now");
    el.bSkip.textContent = phase === "rest" ? "Skip rest" : working ? (skipNext ? "Rest skipped \u2713" : "Skip rest") : "Set rest \u00B7 " + Math.round(REST / 1000) + "s \u25BE";
    el.bSkip.setAttribute("data-mode", phase === "rest" ? "skip" : working ? (skipNext ? "armed" : "skip") : "set");
    el.restTitle.textContent = phase === "switch" ? (swKind === "ready" ? "Get ready" : "Switch sides")
      : (phase === "reps" || (phase === "exercise" && reps)) ? "Rep counter"
      : (phase === "hold" || (phase === "exercise" && hold)) ? (isSide(cur) ? "Side plank timer" : "Plank hold timer") : "Rest stopwatch";
    el.restState.textContent = on ? (running ? "running" : "paused")
      : (phase === "exercise" && reps ? repsOf(cur) + (isSide(cur) ? " each leg" : " reps")
      : (phase === "exercise" && hold ? Math.round(total / 1000) + (isSide(cur) ? " sec each side" : " sec hold") : Math.round(REST / 1000) + " sec rest"));

    var html = "";
    for (var i = 0; i < n; i++) {
      var c = "item" + (done[i] ? " done" : "") + (i === cur && phase !== "complete" ? " cur" : "");
      html += '<li><button class="' + c + '" type="button" data-i="' + i + '"><span class="n">' + (done[i] ? "&#10003;" : (i + 1)) + '</span><span class="t">' + nameOf(i) + '</span><span class="edit' + (OV[okey(i)] !== undefined ? " on" : "") + '">' + (OV[okey(i)] !== undefined ? "Edited" : "Adjust") + '</span></button></li>';
    }
    el.items.innerHTML = html;
    renderTimer();
  }

  /* wheel picker (looping drum, like the iOS timer) */
  var ROW = 44, STEP = 22 * Math.PI / 180, DR = ROW / STEP;
  var sheetMode = "ex", sheetIdx = 0, wheelN = 101, wheelTotal = 303, wheelVal = 0, wheelLo = 0, wheelHi = -1, wheelRaf = 0, wheelTimer = 0, holding = false, sheetOpener = null;
  var sh = { box: $("sheet"), actions: $("sheetActions"), title: $("sheetTitle"), sub: $("sheetSub"), wheel: $("wheel"), unit: $("wheelUnit"), close: $("sheetClose"), save: $("sheetSave"), go: $("sheetGo"), reset: $("sheetReset") };
  el.bFinish = $("bFinish"); el.dialBtn = $("dialBtn"); el.dialAct = $("dialAct");
  el.dialBtn.addEventListener("click", primary);
  el.dialBtn.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); primary(); } });
  function wheelStyle(i, pos) {
    var it = sh.wheel.children[i]; if (!it) return;
    var d = i - pos, a = Math.abs(d);
    if (a > 3.4) { it.style.opacity = "0"; it.style.transform = ""; return; }
    var th = d * STEP, dy = DR * Math.sin(th) - d * ROW, dz = DR * (Math.cos(th) - 1);
    it.style.opacity = Math.max(0.1, Math.pow(Math.cos(th), 2.2)).toFixed(3);
    it.style.transform = "perspective(700px) translateY(" + dy.toFixed(1) + "px) translateZ(" + dz.toFixed(1) + "px) rotateX(" + (-th * 180 / Math.PI).toFixed(1) + "deg)";
  }
  function wheelUpdate() {
    wheelRaf = 0;
    var pos = sh.wheel.scrollTop / ROW, idx = Math.max(0, Math.min(wheelTotal - 1, Math.round(pos)));
    var lo = Math.max(0, Math.floor(pos) - 4), hi = Math.min(wheelTotal - 1, Math.ceil(pos) + 4);
    var a = Math.max(0, Math.min(lo, wheelLo)), b = Math.min(wheelTotal - 1, Math.max(hi, wheelHi));
    for (var i = a; i <= b; i++) wheelStyle(i, pos);
    wheelLo = lo; wheelHi = hi;
    var v = idx % wheelN;
    if (v !== wheelVal) { wheelVal = v; sh.wheel.setAttribute("aria-valuenow", String(v)); if (ctx) beep(2200, 0, 0.012, 0.04, "square"); }
  }
  function wheelNormalize() {
    if (holding || sh.box.hidden) return;
    var idx = Math.round(sh.wheel.scrollTop / ROW), shift = 0;
    if (idx < wheelN) shift = wheelN; else if (idx >= 2 * wheelN) shift = -wheelN;
    if (!shift) return;
    for (var i = wheelLo; i <= wheelHi; i++) { var it = sh.wheel.children[i]; if (it) { it.style.opacity = "0"; it.style.transform = ""; } }
    sh.wheel.scrollTop = sh.wheel.scrollTop + shift * ROW;
    wheelLo = 0; wheelHi = -1; wheelUpdate();
  }
  function wheelGo(idx, smooth) {
    idx = Math.max(0, Math.min(wheelTotal - 1, idx));
    if (sh.wheel.scrollTo) sh.wheel.scrollTo({ top: idx * ROW, behavior: smooth ? "smooth" : "auto" }); else sh.wheel.scrollTop = idx * ROW;
  }
  function wheelTo(v) {
    var idx = Math.round(sh.wheel.scrollTop / ROW), cv = idx % wheelN, d = ((v - cv) % wheelN + wheelN) % wheelN;
    if (d > wheelN / 2) d -= wheelN;
    wheelGo(idx + d, true);
  }
  function wheelValue() { return Math.round(sh.wheel.scrollTop / ROW) % wheelN; }
  function showWheel(o) {
    audio();
    sheetOpener = document.activeElement;
    wheelN = o.max + 1; wheelTotal = wheelN * 3;
    sh.title.textContent = o.title; sh.sub.textContent = o.sub; sh.unit.textContent = o.unit;
    sh.go.hidden = !o.go; sh.actions.classList.toggle("two", !o.go);
    sh.wheel.setAttribute("aria-valuemax", String(o.max)); sh.wheel.setAttribute("aria-valuenow", String(o.value)); sh.wheel.setAttribute("aria-label", o.unit);
    var h = "";
    for (var c = 0; c < 3; c++) for (var k = 0; k <= o.max; k++) h += '<div class="it" data-i="' + (c * wheelN + k) + '" style="opacity:0"><span>' + k + "</span></div>";
    sh.wheel.innerHTML = h; wheelLo = 0; wheelHi = -1; wheelVal = o.value; holding = false;
    sh.box.hidden = false; document.body.classList.add("sheet-open");
    requestAnimationFrame(function () { sh.wheel.scrollTop = (wheelN + o.value) * ROW; wheelUpdate(); try { sh.wheel.focus({ preventScroll: true }); } catch (e) {} });
  }
  function openSheet(i) {
    sheetMode = "ex"; sheetIdx = i;
    var timed = isTimed(i), base = DAYS[day][i] || "";
    showWheel({
      title: base.replace(/^(\d+s|1-min|\d+)\s*/i, ""),
      sub: (timed ? "Set seconds, 0 to 180" : "Set reps, 0 to 100") + " · plan " + planVal(i),
      unit: timed ? (isSide(i) ? "sec each side" : "sec") : (isSide(i) ? "reps each leg" : "reps"),
      max: timed ? 180 : 100, value: valOf(i), go: true
    });
  }
  function openRestSheet() {
    sheetMode = "rest";
    showWheel({ title: "Rest time", sub: "Seconds between exercises · plan 30", unit: "sec", max: 180, value: Math.round(REST / 1000), go: false });
  }
  function closeSheet() {
    sh.box.hidden = true; document.body.classList.remove("sheet-open"); clearTimeout(wheelTimer);
    try { if (sheetOpener && sheetOpener.focus) sheetOpener.focus({ preventScroll: true }); } catch (e) {}
  }
  function applyRest(sec) {
    REST = sec * 1000; save();
    if (phase === "rest") {
      if (REST <= 0) { running = false; unlock(); endRest(true); return; }
      total = REST; restLeft = REST; endAt = performance.now() + REST; lastWhole = -1;
    } else if (phase === "exercise" || phase === "complete") stopTimer();
    renderAll();
  }
  function saveSheet(go) {
    var v = wheelValue();
    if (sheetMode === "rest") { closeSheet(); applyRest(v); return; }
    var i = sheetIdx;
    if (v === planVal(i)) delete OV[okey(i)]; else OV[okey(i)] = v;
    saveOV(); closeSheet();
    if (go || (i === cur && (phase === "hold" || phase === "reps" || phase === "switch"))) { cur = i; phase = "exercise"; stopTimer(); }
    else if (i === cur && phase === "exercise") stopTimer();
    renderAll();
  }
  function release() { holding = false; clearTimeout(wheelTimer); wheelTimer = setTimeout(wheelNormalize, 200); }
  sh.wheel.addEventListener("scroll", function () {
    if (!wheelRaf) wheelRaf = requestAnimationFrame(wheelUpdate);
    clearTimeout(wheelTimer); wheelTimer = setTimeout(wheelNormalize, 160);
  }, { passive: true });
  sh.wheel.addEventListener("touchstart", function () { holding = true; }, { passive: true });
  sh.wheel.addEventListener("touchend", release, { passive: true });
  sh.wheel.addEventListener("touchcancel", release, { passive: true });
  sh.wheel.addEventListener("click", function (e) { var it = e.target.closest(".it"); if (it) wheelGo(parseInt(it.getAttribute("data-i"), 10), true); });
  sh.wheel.addEventListener("keydown", function (e) {
    var idx = Math.round(sh.wheel.scrollTop / ROW);
    if (e.key === "ArrowUp") { e.preventDefault(); wheelGo(idx - 1, true); }
    else if (e.key === "ArrowDown") { e.preventDefault(); wheelGo(idx + 1, true); }
    else if (e.key === "PageUp") { e.preventDefault(); wheelGo(idx - 10, true); }
    else if (e.key === "PageDown") { e.preventDefault(); wheelGo(idx + 10, true); }
    else if (e.key === "Enter") { e.preventDefault(); saveSheet(false); }
  });
  sh.save.addEventListener("click", function () { saveSheet(false); });
  sh.go.addEventListener("click", function () { saveSheet(true); });
  sh.reset.addEventListener("click", function () { wheelTo(sheetMode === "rest" ? 30 : planVal(sheetIdx)); });
  sh.close.addEventListener("click", closeSheet);
  sh.box.addEventListener("click", function (e) { if (e.target === sh.box) closeSheet(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !sh.box.hidden) closeSheet(); });

  /* events */
  el.name.addEventListener("click", function () { if (phase !== "complete") openSheet(cur); });
  el.bReset.addEventListener("click", stopBtn);
  el.bSkip.addEventListener("click", restBtn);
  el.bFinish.addEventListener("click", finish);
  el.bClear.addEventListener("click", resetDay);
  el.setMinus.addEventListener("click", function () { changeSets(-1); });
  el.setPlus.addEventListener("click", function () { changeSets(1); });
  function holdRepeat(btn, d) {
    var t1 = null, t2 = null, used = false;
    function stop() { clearTimeout(t1); clearInterval(t2); t1 = t2 = null; }
    btn.addEventListener("pointerdown", function (e) { used = true; changePace(d); stop(); t1 = setTimeout(function () { t2 = setInterval(function () { changePace(d); }, 70); }, 450); });
    ["pointerup", "pointerleave", "pointercancel"].forEach(function (n) { btn.addEventListener(n, stop); });
    btn.addEventListener("click", function () { if (used) { used = false; return; } changePace(d); });
    btn.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  }
  holdRepeat(el.paceMinus, -100); holdRepeat(el.pacePlus, 100);
  el.bVoice.addEventListener("click", function () { voiceOn = !voiceOn; save(); if (!voiceOn) hush(); else speak("Voice on"); renderAll(); });
  el.day.addEventListener("change", function () { loadDay(parseInt(el.day.value, 10) || 0); });
  el.prev.addEventListener("click", function () { if (day > 0) loadDay(day - 1); });
  el.next.addEventListener("click", function () { if (day < DAYS.length - 1) loadDay(day + 1); });
  el.items.addEventListener("click", function (e) {
    var b = e.target.closest("button[data-i]"); if (!b) return;
    openSheet(parseInt(b.getAttribute("data-i"), 10));
  });

  resetDay();
})();
</script>
<script>
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
}
</script>
